services:
  text2video:
    build: .
    image: ${IMAGE_NAME:-dev-text2video:local}
    ports: ["${API_PORT:-7102}:7102"]
    environment:
      API_PORT: 7102
      API_KEY: ${API_KEY:-}
      DEVICE: ${DEVICE:-cpu}
      VIDEO_MODEL_ID: ${VIDEO_MODEL_ID:-stabilityai/stable-video-diffusion-img2vid-xt}
      IMAGE_MODEL_ID: ${IMAGE_MODEL_ID:-stabilityai/stable-diffusion-xl-base-1.0}
      MAX_JOBS: ${MAX_JOBS:-8}
      HF_HOME: /cache/huggingface
    volumes:
      - ${MODEL_CACHE:-text2video-cache}:/cache
      - ${OUTPUT_DIR:-./outputs}:/data
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  text2video-nvidia:
    extends: text2video
    profiles: ["nvidia"]
    environment:
      API_PORT: 7102
      API_KEY: ${API_KEY:-}
      DEVICE: cuda
      VIDEO_MODEL_ID: ${VIDEO_MODEL_ID:-stabilityai/stable-video-diffusion-img2vid-xt}
      IMAGE_MODEL_ID: ${IMAGE_MODEL_ID:-stabilityai/stable-diffusion-xl-base-1.0}
      MAX_JOBS: ${MAX_JOBS:-8}
      HF_HOME: /cache/huggingface
    ports: ["${NVIDIA_API_PORT:-7103}:7102"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  text2video-cache:
